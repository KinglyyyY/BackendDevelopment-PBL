name: PBL test and Docker publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Start app and MongoDB
        run: docker compose up --build --detach

      - name: Test all app routes
        run: python3 automationTesting.py

      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERUSERNAME: ${{ secrets.DOCKERUSERNAME }}
          DOCKERTOKEN: ${{ secrets.DOCKERTOKEN }}
        run: |
          if [[ -n "$DOCKERUSERNAME" && -n "$DOCKERTOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub publish skipped. Add repository secrets DOCKERUSERNAME and DOCKERTOKEN to enable it."
          fi

      - name: Check out repository
        if: steps.dockerhub.outputs.available == 'true'
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERUSERNAME }}
          password: ${{ secrets.DOCKERTOKEN }}

      - name: Build and push image
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERUSERNAME }}/backenddevelopment-pbl:latest
            ${{ secrets.DOCKERUSERNAME }}/backenddevelopment-pbl:${{ github.sha }}
